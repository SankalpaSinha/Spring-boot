spring:
  application:
    name: pointscore

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pointscore}
    username: ${DB_USER:pointscore}
    password: ${DB_PASSWORD:pointscore}

  jpa:
    # Flyway owns the schema. Hibernate is told to validate its entity mappings
    # against the tables the migrations produced and refuse to start if they
    # disagree -- so a forgotten migration fails loudly at boot instead of
    # silently at 3am. Never 'update' outside a toy project.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    io.pointscore: DEBUG
