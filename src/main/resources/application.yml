spring:
  application:
    name: pointscore

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pointscore}
    username: ${DB_USER:pointscore}
    password: ${DB_PASSWORD:pointscore}

  jpa:
    # Flyway owns the schema. Hibernate is told to validate its entity mappings
    # against the tables the migrations produced and refuse to start if they
    # disagree -- so a forgotten migration fails loudly at boot instead of
    # silently at 3am. Never 'update' outside a toy project.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

server:
  # Hosts such as Render inject PORT; locally it stays 8080.
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Component details (database vendor, disk paths) are for operators. Without
      # roles, "when-authorized" would show them to any self-registered member.
      show-details: when-authorized
      roles: ADMIN

logging:
  level:
    io.pointscore: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs

# Programme policy -- the brand's rules, not the code's.
pointscore:
  # Decides what counts as a weekend and when expiry dates land.
  zone: Asia/Kolkata
  # Points survive twelve calendar months from the day they were earned.
  point-expiry-months: 12
  # Tier status is judged on points earned in a rolling twelve months.
  qualification-window-months: 12
  expiry-job:
    enabled: true
  tier-review-job:
    enabled: true
  security:
    # HS256 signing key, at least 32 bytes. Left blank, a random key is
    # generated at boot: fine for development and tests, wrong for anything
    # that restarts or runs two instances -- every token dies with the process.
    jwt-secret: ${JWT_SECRET:}
    token-ttl: 12h
    # The first admin. Admins are not enrolled through the public API, so the
    # only way in is to configure one; created at startup if it does not exist.
    bootstrap-admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
