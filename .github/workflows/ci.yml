name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ubuntu-latest ships a Docker daemon on the default socket, which is all
      # Testcontainers needs. No ~/.testcontainers.properties here, so the
      # Postgres container is fresh every run rather than reused.
      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify
